sh(q.slice(2)).forEach(t=>{const b=document.createElement('button');b.className='o';b.textContent=t;b.onclick=()=>pick(b,t,q);os.appendChild(b)})}
function pick(b,t,q){
const ok=t===q[2];if(ok)s++;else w.push(q);
document.querySelectorAll('.o').forEach(x=>{x.disabled=true;if(x.textContent===q[2])x.classList.add('ok')});
if(!ok)b.classList.add('no');
const n=document.getElementById('nx');n.innerHTML=`<button class="b">${i+1<L.length?'Келесі':'Нәтиже'}</button>`;
n.firstChild.onclick=()=>{i++;show()}}
function end(){
const p=Math.round(s/L.length*100);
A.innerHTML=`<div class="card"><div class="big">${s} / ${L.length} (${p}%)</div><p>${p>=85?'Тамаша!':p>=60?'Жақсы, қайталап көріңіз.':'Тақырыптарды қайта оқып шығыңыз.'}</p>${w.length?'<b>Қате жауаптар:</b>'+w.map(q=>`<div class="r"><span style="color:var(--mu)">${q[0]}</span><br>${q[1]}<br><b style="color:var(--ok)">${q[2]}</b></div>`).join(''):''}<button class="b" id="rs">Қайта бастау</button></div>`;
document.getElementById('rs').onclick=start}
start();
</script></body></html>
